<!doctype html>
<!-- Version : pagination adaptée, rotation globale et glissement latéral libre -->
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>FMttn — Liseuse PNG + Corrections</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{ --gap:24px; --gutter:18px; --bg:#f5f6f8; --ink:#111; --panelW:270px; --warn:#ef4444; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{ margin:0; font:14px/1.45 system-ui,Arial; background:var(--bg); color:var(--ink);
        overflow-y:scroll; overflow-x:hidden; }
  body.pan-enabled{overflow-x:hidden}
  body.pan-enabled #viewport,
  body.pan-enabled .page,
  body.pan-enabled .box,
  body.pan-enabled .page img,
  body.pan-enabled .ov,
  body.pan-enabled .linksLayer{cursor:grab}
  body.pan-enabled .link-hotspot{cursor:pointer}
  body.pan-enabled #viewport{touch-action:none;will-change:transform}
  body.is-panning,
  body.is-panning #viewport,
  body.is-panning .page,
  body.is-panning .box,
  body.is-panning .page img,
  body.is-panning .ov,
  body.is-panning .linksLayer{cursor:grabbing!important;user-select:none}
  body.annotation-enabled .dr{cursor:crosshair;touch-action:none}
  body.annotation-text .dr{cursor:text}
  body.annotation-select .dr{cursor:default}
  body.annotation-select.annotation-dragging .dr{cursor:move}

  .wrap{ width:100%; margin:0; padding:12px; padding-right:calc(var(--panelW) + 24px) }
  #viewport{ margin-top:8px; display:flex; flex-direction:column; align-items:center; }
  .flow-1up{display:block}
  .flow-1up .page{margin:0 0 var(--gap) 0;}
  .flow-2up{display:block}
  .spread{ display:flex; justify-content:center; align-items:flex-start; column-gap:var(--gutter); margin:0 0 var(--gap) 0 }

  .page{ position:relative; display:block; background:#fff; box-shadow:0 10px 30px rgba(0,0,0,.08);
         border-radius:8px; width:fit-content; }
  .page.page-landscape{overflow:hidden}
  .page.page-landscape .box{position:absolute;left:0;top:0;transform-origin:top left}
  .page.missing{ outline:3px solid var(--warn); }
  .spacer{background:transparent; box-shadow:none; border:1px dashed #e5e7eb}
  .box{position:relative; display:inline-block; will-change:width,height}
  .page img{display:block;max-width:100%;height:auto;user-select:none;-webkit-user-drag:none}

  /* calques */
  .ov{position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:1}
  .dr{position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:3}

  /* couche des liens : coordonnées en px natifs + scale CSS */
  .linksLayer{ position:absolute; left:0; top:0; width:0; height:0; z-index:2; pointer-events:auto; transform-origin:top left; }
  .linksLayer.links-blocked{ pointer-events:none; }
  .link-hotspot{ position:absolute; display:block; outline:none; border:0; background:transparent; }
  .linksLayer:not(.links-blocked) .link-hotspot{ cursor:pointer; }
  .link-hotspot.dbg{ background:rgba(255,200,0,.18); border:1px dashed rgba(255,200,0,.55); }
  .link-hotspot.selected{background:rgba(220,38,38,.2);border:3px solid #dc2626;box-sizing:border-box}
  .linksLayer.links-hidden,.linksLayer.links-blocked{ pointer-events:none; }
  .linkEditor{display:none;border-top:1px solid #e5e7eb;padding-top:8px;margin-top:2px}
  .linkEditor.active{display:flex;flex-direction:column;gap:8px}
  .linkField{width:100%;padding:7px 8px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
  .editorHint{font-size:12px;line-height:1.35;opacity:.75}

  /* panneau */
  .side{ position:fixed; top:12px; right:12px; bottom:12px; width:var(--panelW); background:#fff; border:1px solid #e5e7eb;
         border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:10px; padding:10px;
         z-index:20; overflow:auto; transition:transform .2s, box-shadow .2s; }
  .side.collapsed{ transform:translateX(calc(100% + 40px)); box-shadow:none; }
  .header{display:flex; justify-content:center; align-items:center}
  .title{font-weight:800}
  .section{border:1px solid #e5e7eb;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .btn{ position:relative; border:1px solid #d1d5db; background:#fff; padding:6px 10px; border-radius:8px; cursor:pointer; user-select:none; overflow:hidden; }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-dark{background:#111;color:#fff;border-color:#111}
  .btn-amber{background:#ffd166;border-color:#e9b44e}
  .btn-view-active{background:#e5e7eb;border-color:#d1d5db;font-weight:400}
  .btn:active::after{content:""; position:absolute; inset:0; background:rgba(0,0,0,.08);}
  .pill{padding:6px 10px;border-radius:999px;background:#f3f4f6;border:1px solid #e5e7eb;min-width:44px;text-align:center}
  .pageJumpGroup{display:flex;align-items:center;gap:5px}
  .jump{width:108px;padding:6px 8px;border:1px solid #d1d5db;border-radius:8px;text-align:center}
  .toggler{ position:fixed; right:12px; top:12px; background:#111; color:#fff; border:none; border-radius:10px; padding:8px 10px; cursor:pointer; z-index:21 }
  #zoomSlider{ appearance:none; height:6px; border-radius:999px; background:#e5e7eb; width:160px; margin-left:8px; }
  #zoomSlider::-webkit-slider-thumb{ appearance:none; width:16px; height:16px; border-radius:999px; background:#111; cursor:pointer; }
  #zoomSlider::-moz-range-thumb{ width:16px; height:16px; border-radius:999px; background:#111; cursor:pointer }
  .mascot{margin-top:auto;text-align:center}
  .mascot img{max-width:140px;height:auto;user-select:none;-webkit-user-drag:none}
  .badge{ position:absolute; top:8px; right:8px; background:#111; color:#fff; font:500 12px/1 system-ui,Arial; padding:4px 8px; border-radius:999px; pointer-events:none; }
  .badge.warn{ background:var(--warn) }

  /* fenêtre des annotations */
  .annotationPopup{position:fixed;right:294px;top:116px;width:310px;max-width:calc(100vw - 24px);background:#fff;border:1px solid #d1d5db;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.2);padding:14px;z-index:40;display:none;font-family:Calibri,"Carlito","Segoe UI",sans-serif}
  .annotationPopup.open{display:block}
  .annotationPopupHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .annotationPopupTitle{font-size:17px;font-weight:700}
  .annotationClose{width:32px;height:32px;padding:0;font-size:20px;line-height:1}
  .annotationLabel{font-weight:700;margin:9px 0 6px}
  .colorGrid{display:flex;gap:10px;margin-bottom:12px}
  .colorChoice{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #9ca3af;cursor:pointer;padding:0}
  .colorChoice.selected{box-shadow:0 0 0 3px #111}
  .fontSizeRow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .fontSizeInput{width:84px;padding:7px 9px;border:1px solid #9ca3af;border-radius:8px;background:#fff;font:16px/1 Calibri,"Carlito","Segoe UI",sans-serif}
  .fontSizeUnit{color:#4b5563}
  .annotationTools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .annotationTool{display:flex;align-items:center;justify-content:flex-start;gap:8px;min-height:40px;font-family:Calibri,"Carlito","Segoe UI",sans-serif}
  .annotationToolWide{grid-column:1/-1;justify-content:center}
  .annotationTool.selected{background:#111;color:#fff;border-color:#111}
  .toolIcon{width:22px;text-align:center;font-size:19px;line-height:1}
  .annotationActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid #e5e7eb}
  .annotationHint{font-size:12px;color:#4b5563;margin-top:10px;line-height:1.35}
  .inlineTextEditor{position:absolute;z-index:4;margin:0;padding:0;border:3px dashed currentColor;border-radius:2px;background:rgba(255,255,255,.08);outline:none;resize:none;overflow:hidden;font-family:Calibri,"Carlito","Segoe UI",sans-serif;line-height:1.22;color:inherit;caret-color:currentColor;box-sizing:border-box}
  .inlineTextEditor::placeholder{color:currentColor;opacity:.48}
  @media (max-width:760px){.annotationPopup{right:12px;top:64px}}

  /* on masque la légende numérotée */
  .num{display:none!important}
</style>
</head>
<body>
<button id="toggleSide" class="toggler" title="Afficher/masquer le menu">☰</button>

<aside id="side" class="side" aria-label="Outils de lecture">
  <div class="header"><div class="title">Outils</div></div>

  <div class="section">
    <div class="row"><strong>Pages</strong></div>
    <div class="row">
      <button class="btn" id="tocButton">Table des matières</button>
      <span class="pageJumpGroup">
        <input id="pageJump" class="jump" type="text" inputmode="numeric" placeholder="n°" aria-label="Numéro de la page affichée" />
      </span>
    </div>
  </div>

  <div class="section">
    <div class="row"><strong>Affichage</strong></div>
    <div class="row">
      <button class="btn" id="mode1up">1 page</button>
      <button class="btn" id="mode2up">2 pages</button>
      <button class="btn" id="landscapeMode" title="Faire pivoter toutes les pages de 90° vers la droite">Mode paysage</button>
    </div>
    <label class="row" style="gap:6px">
      <input type="checkbox" id="bookMode" /> Pair à gauche / impair à droite
    </label>
  </div>

  <div class="section">
    <div class="row"><strong>Zoom</strong></div>
    <div class="row">
      <button class="btn" id="zoomOut">–</button>
      <span class="pill" id="zoomVal">100%</span>
      <button class="btn" id="zoomIn">+</button>
      <input id="zoomSlider" type="range" min="30" max="200" value="100" step="1" />
    </div>
    <div class="row">
      <button class="btn btn-amber" id="fitWidth">Adapter à la largeur</button>
    </div>
  </div>

  <div class="section">
    <div class="row"><strong>Corrections</strong></div>
    <div class="row">
      <button id="toggleRect" class="btn btn-dark">Locales : OFF</button>
      <button id="undo" class="btn" title="Revenir en arrière (Ctrl+Z)">↶</button>
      <button id="clear" class="btn">Effacer</button>
    </div>
    <button id="revealAll" class="btn btn-amber" disabled>Préchargement… 0%</button>
  </div>

  <div class="section">
    <div class="row"><strong>Annotations</strong></div>
    <div class="row">
      <button id="openAnnotations" class="btn">Ouvrir les annotations</button>
    </div>
  </div>

  <div class="section">
    <div class="row"><strong>Liens</strong></div>
    <div class="row">
      <button id="linksToggle" class="btn btn-amber">Activer les liens</button>
    </div>
    <div id="linkEditor" class="linkEditor">
      <strong>Encoder un lien</strong>
      <select id="linkKind" class="linkField">
        <option value="external">Lien Internet</option>
        <option value="internal">Page de la liseuse</option>
      </select>
      <input id="linkTarget" class="linkField" type="text" placeholder="https://…" />
      <input id="linkTitle" class="linkField" type="text" placeholder="Titre facultatif" />
      <button id="linkDraw" class="btn btn-dark">Tracer la zone du lien</button>
      <button id="linkDeleteSelected" class="btn" disabled>Supprimer le lien sélectionné</button>
      <button id="linkExport" class="btn btn-amber">Télécharger links.json</button>
      <div id="linkEditorInfo" class="editorHint">Pour retirer un ancien lien : active les liens, puis clique sur sa zone.</div>
    </div>
  </div>

  <div class="mascot"><img src="./mascotte.png" alt="Mascotte FMttn" draggable="false" /></div>
</aside>

<div id="annotationPopup" class="annotationPopup" role="dialog" aria-modal="false" aria-labelledby="annotationPopupTitle">
  <div class="annotationPopupHeader">
    <div id="annotationPopupTitle" class="annotationPopupTitle">Annotations</div>
    <button id="closeAnnotations" class="btn annotationClose" title="Fermer" aria-label="Fermer">×</button>
  </div>
  <div class="annotationLabel">Couleur</div>
  <div class="colorGrid" role="group" aria-label="Couleur de l'annotation">
    <button class="colorChoice selected" data-color="#ffe100" style="background:#ffe100" title="Jaune" aria-label="Jaune"></button>
    <button class="colorChoice" data-color="#ef4444" style="background:#ef4444" title="Rouge" aria-label="Rouge"></button>
    <button class="colorChoice" data-color="#22c55e" style="background:#22c55e" title="Vert" aria-label="Vert"></button>
    <button class="colorChoice" data-color="#3b82f6" style="background:#3b82f6" title="Bleu" aria-label="Bleu"></button>
  </div>
  <div class="annotationLabel"><label for="annotationFontSize">Taille de police</label></div>
  <div class="fontSizeRow">
    <input id="annotationFontSize" class="fontSizeInput" type="number" min="12" max="80" step="1" value="34" inputmode="numeric" aria-label="Taille de la police" />
    <span class="fontSizeUnit">px</span>
  </div>
  <div class="annotationLabel">Outil</div>
  <div class="annotationTools">
    <button class="btn annotationTool annotationToolWide" data-tool="select"><span class="toolIcon">↖</span>Sélectionner / déplacer</button>
    <button class="btn annotationTool" data-tool="highlight"><span class="toolIcon">▰</span>Surligneur</button>
    <button class="btn annotationTool" data-tool="freehand"><span class="toolIcon">✎</span>Dessin libre</button>
    <button class="btn annotationTool" data-tool="rectangle"><span class="toolIcon">▭</span>Rectangle</button>
    <button class="btn annotationTool" data-tool="ellipse"><span class="toolIcon">◯</span>Cercle</button>
    <button class="btn annotationTool" data-tool="line"><span class="toolIcon">╱</span>Ligne</button>
    <button class="btn annotationTool" data-tool="text"><span class="toolIcon">T</span>Texte</button>
  </div>
  <div id="annotationHint" class="annotationHint">Choisis une couleur, puis un outil.</div>
  <div class="annotationActions">
    <button id="stopAnnotation" class="btn" disabled>Arrêter l'outil</button>
    <button id="clearAnnotations" class="btn">Effacer les annotations</button>
  </div>
</div>

<div class="wrap"><div id="viewport" aria-live="polite" class="flow-1up"></div></div>

<script>
/*** PARAMS ***/
const DOCS_ROOT = "./docs";
const CORRECTIONS_ROOT = "./corrections/monDoc";
const LINKS_JSON_URL = "./links.json";

const fileName = n =>
  `Altx_1a_Corrections_version Numabib${n === 1 ? "" : n}.png`;

const docPath = n => `${DOCS_ROOT}/${fileName(n)}`;
const corrPath = n => `${CORRECTIONS_ROOT}/${fileName(n)}`;

const REF_WIDTH_PX = Math.round(1240 * 0.35 * 2);
const MIN_PCT = 30, MAX_PCT = 200;
const FRONT_MATTER_PAGES = 2;
const TABLE_OF_CONTENTS_PAGE = 6;
const HIGHLIGHT_OPACITY = 0.36;
const HIGHLIGHT_WIDTH_PX = 54;
const HIGHLIGHTS_STORAGE_KEY = `fmttn-highlights-v1:${location.pathname}`;
const ANNOTATIONS_STORAGE_KEY = `fmttn-annotations-v2:${location.pathname}`;
const DRAW_WIDTH_PX = 7;
const DEFAULT_TEXT_FONT_PX = 34;

/*** STATE & REFS ***/
let layout="1up", bookMode=false, landscapeMode=false, zoomPct=100, drawMode=false, annotationTool=null, annotationColor='#ffe100', annotationFontSize=DEFAULT_TEXT_FONT_PX, linksVisible=false, linkDrawMode=false;
let panEnabled=false, isPanning=false, panX=0;
let fitZoomPct=MAX_PCT;
let corrReadyCount = 0, revealReady = false;
const LINK_EDITOR = new URLSearchParams(location.search).get('editLinks') === '1';

const $viewport=document.getElementById('viewport');
const $pageJump=document.getElementById('pageJump');
const $zoomVal=document.getElementById('zoomVal');
const $tocButton=document.getElementById('tocButton');
const $mode1=document.getElementById('mode1up'), $mode2=document.getElementById('mode2up');
const $landscape=document.getElementById('landscapeMode');
const $book=document.getElementById('bookMode');
const $zin=document.getElementById('zoomIn'), $zout=document.getElementById('zoomOut');
const $fitW=document.getElementById('fitWidth');
const $toggleRect=document.getElementById('toggleRect'), $clear=document.getElementById('clear'), $revealAll=document.getElementById('revealAll');
const $undo=document.getElementById('undo');
const $openAnnotations=document.getElementById('openAnnotations');
const $annotationPopup=document.getElementById('annotationPopup');
const $closeAnnotations=document.getElementById('closeAnnotations');
const $stopAnnotation=document.getElementById('stopAnnotation');
const $clearAnnotations=document.getElementById('clearAnnotations');
const $annotationHint=document.getElementById('annotationHint');
const $annotationFontSize=document.getElementById('annotationFontSize');
const $side=document.getElementById('side'), $toggleSide=document.getElementById('toggleSide');
const $slider=document.getElementById('zoomSlider');
const $linksToggle=document.getElementById('linksToggle');
const $linkEditor=document.getElementById('linkEditor');
const $linkKind=document.getElementById('linkKind');
const $linkTarget=document.getElementById('linkTarget');
const $linkTitle=document.getElementById('linkTitle');
const $linkDraw=document.getElementById('linkDraw');
const $linkDeleteSelected=document.getElementById('linkDeleteSelected');
const $linkEditorInfo=document.getElementById('linkEditorInfo');

const pages=[]; // objets pages
let currentIndex=0, firstPageWidth=null, firstPageHeight=null;

/* Undo */
const historyStack=[];
let selectedLink=null;
let storedAnnotations=loadStoredAnnotations();
let pendingTextAnnotation=null;
let selectedAnnotation=null;
let annotationFontEditBefore=null;

/* spacer pour mode livre */
const spacer=document.createElement('div'); spacer.className='page spacer';
const spacerBox=document.createElement('div'); spacerBox.className='box'; spacer.appendChild(spacerBox);

/*** UTILS ***/
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cssScaleFromPct=()=>!firstPageWidth?1:(zoomPct/100)*(REF_WIDTH_PX/firstPageWidth);
const displayNumberFromIndex=index=>index===0?'0':index===1?'':String(index-1);
const displayNumberFromPhysical=n=>displayNumberFromIndex(n-1);
const pageLabelFromPhysical=n=>n===1?'couverture':n===2?'deuxième de couverture':`page ${n-FRONT_MATTER_PAGES}`;
const bookPageToIndex=n=>n===0?0:n+FRONT_MATTER_PAGES-1;

function loadStoredAnnotations(){
  try{
    const parsed=JSON.parse(localStorage.getItem(ANNOTATIONS_STORAGE_KEY)||'null');
    if(parsed && typeof parsed==='object') return parsed;
  }catch(_){ return {}; }
  try{
    const old=JSON.parse(localStorage.getItem(HIGHLIGHTS_STORAGE_KEY)||'{}');
    const migrated={};
    for(const [page,lines] of Object.entries(old||{})){
      if(Array.isArray(lines)) migrated[page]=lines.map(line=>({kind:'highlight',x1:line.x1,x2:line.x2,y:line.y,width:line.width||HIGHLIGHT_WIDTH_PX,color:'#ffe100'}));
    }
    return migrated;
  }catch(_){ return {}; }
}
function saveAnnotations(){
  const saved={};
  for(const p of pages){
    if(p.annotations?.length) saved[String(p.idx)]=p.annotations;
  }
  storedAnnotations=saved;
  try{ localStorage.setItem(ANNOTATIONS_STORAGE_KEY,JSON.stringify(saved)); }catch(_){}
}

/*** ZOOM ***/
function fitWidthPct(){
  if(!firstPageWidth) return MAX_PCT;
  const vp=$viewport.getBoundingClientRect();
  const gutter=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gutter'))||18;
  const targetCssWidth=(layout==='1up')?(vp.width-2):((vp.width-gutter)/2);
  const naturalDisplayWidth=landscapeMode?(pages[currentIndex]?.h||pages[0]?.h||firstPageWidth):firstPageWidth;
  const desiredCssScale=targetCssWidth/naturalDisplayWidth;
  const desiredPct=desiredCssScale*100*(firstPageWidth/REF_WIDTH_PX);
  return clamp(Math.round(desiredPct),MIN_PCT,MAX_PCT);
}
function refreshFitWidthPct(){
  fitZoomPct=fitWidthPct();
  return fitZoomPct;
}
function updatePanState(){
  const zoomAllowsPan=!!firstPageWidth && zoomPct>fitZoomPct;
  const shouldEnable=zoomAllowsPan && !drawMode && !annotationTool && !linkDrawMode;
  panEnabled=shouldEnable;
  document.body.classList.toggle('pan-enabled',panEnabled);
  if(!zoomAllowsPan){
    isPanning=false;
    document.body.classList.remove('is-panning');
    panX=0;
    $viewport.style.removeProperty('transform');
  }else{
    if(!panEnabled){
      isPanning=false;
      document.body.classList.remove('is-panning');
    }
    panX=clamp(panX,-horizontalPanLimit(),horizontalPanLimit());
    applyHorizontalPan();
  }
}
function horizontalPanLimit(){
  const availableWidth=Math.max(1,$viewport.clientWidth);
  const currentCard=pages[currentIndex]?.elPage||pages[0]?.elPage;
  const currentRow=layout==='2up' ? currentCard?.closest('.spread') : currentCard;
  const contentWidth=currentRow?.scrollWidth||currentRow?.offsetWidth||availableWidth;
  const overflow=Math.max(0,(contentWidth-availableWidth)/2);
  const extraPlay=clamp(Math.round(availableWidth*.32),180,380);
  return Math.ceil(overflow+extraPlay);
}
function applyHorizontalPan(){
  const zoomAllowsPan=!!firstPageWidth && zoomPct>fitZoomPct;
  if(!zoomAllowsPan || Math.abs(panX)<.5){
    $viewport.style.removeProperty('transform');
    return;
  }
  $viewport.style.transform=`translate3d(${Math.round(panX)}px,0,0)`;
}
function attachPanHandlers(){
  let pointerId=null, startX=0, startY=0, startPanX=0, startScrollY=0, dragLimit=0;

  const stopPan=e=>{
    if(pointerId===null || (e && e.pointerId!==pointerId)) return;
    if($viewport.hasPointerCapture?.(pointerId)) $viewport.releasePointerCapture(pointerId);
    pointerId=null;
    isPanning=false;
    document.body.classList.remove('is-panning');
  };

  $viewport.addEventListener('pointerdown',e=>{
    if(!panEnabled || drawMode || annotationTool || linkDrawMode) return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(e.target.closest('.link-hotspot')) return;
    pointerId=e.pointerId;
    startX=e.clientX;
    startY=e.clientY;
    startPanX=panX;
    startScrollY=window.scrollY;
    dragLimit=horizontalPanLimit();
    isPanning=true;
    document.body.classList.add('is-panning');
    $viewport.setPointerCapture?.(pointerId);
    e.preventDefault();
  });

  $viewport.addEventListener('pointermove',e=>{
    if(!isPanning || e.pointerId!==pointerId) return;
    panX=clamp(startPanX+(e.clientX-startX),-dragLimit,dragLimit);
    applyHorizontalPan();
    window.scrollTo(0,startScrollY-(e.clientY-startY));
    e.preventDefault();
  });
  $viewport.addEventListener('pointerup',stopPan);
  $viewport.addEventListener('pointercancel',stopPan);
  $viewport.addEventListener('lostpointercapture',stopPan);
}
function applyZoom(){
  const s=cssScaleFromPct();
  for(const p of pages){
    const cssW=Math.round(p.w*s), cssH=Math.round(p.h*s);
    p.box.style.width=cssW+'px';
    p.box.style.height=cssH+'px';
    p.elPage.classList.toggle('page-landscape',landscapeMode);
    if(landscapeMode){
      p.elPage.style.width=cssH+'px';
      p.elPage.style.height=cssW+'px';
      p.box.style.transform=`translateX(${cssH}px) rotate(90deg)`;
    }else{
      p.elPage.style.removeProperty('width');
      p.elPage.style.removeProperty('height');
      p.box.style.removeProperty('transform');
    }
    updateLinkLayerScale(p);
  }
  if(pages[0]){
    const spacerW=Math.round(pages[0].w*s), spacerH=Math.round(pages[0].h*s);
    spacerBox.style.width=(landscapeMode?spacerH:spacerW)+'px';
    spacerBox.style.height=(landscapeMode?spacerW:spacerH)+'px';
  }
  $zoomVal.textContent=`${zoomPct}%`;
  if($slider) $slider.value=String(zoomPct);
  updateInlineTextEditorScale();
  updatePanState();
  if(selectedAnnotation) redrawDraft(selectedAnnotation.p,null);
}
function fitWidth(){
  if(!firstPageWidth) return;
  zoomPct=refreshFitWidthPct();
  applyZoom();
}

/*** NAV ***/
function cardsReal(){ return [...document.querySelectorAll('.page:not(.spacer)')]; }
function displayedPageNumbers(){
  const currentCard=cardsReal()[currentIndex];
  if(!currentCard) return [];

  const visibleCards=layout==='2up'
    ? [...(currentCard.closest('.spread')?.querySelectorAll('.page:not(.spacer)')||[currentCard])]
    : [currentCard];

  return visibleCards
    .map(card=>pages.findIndex(p=>p.elPage===card))
    .filter(index=>index>=0)
    .map(displayNumberFromIndex)
    .filter(number=>number!=='');
}
function syncPageUI(){
  const numbers=displayedPageNumbers();
  $pageJump.dataset.displayedNumbers=JSON.stringify(numbers);
  $pageJump.value=layout==='2up' && numbers.length>1
    ? `${numbers[0]} – ${numbers[1]}`
    : (numbers[0]||'');
}
function goToEnteredPage(){
  const entered=($pageJump.value.match(/\d+/g)||[]).map(Number);
  const previous=JSON.parse($pageJump.dataset.displayedNumbers||'[]').map(Number);
  let n;

  if(entered.length===1){
    n=entered[0];
  }else if(entered.length>=2){
    const leftChanged=entered[0]!==previous[0];
    const rightChanged=entered[1]!==previous[1];
    if(leftChanged && !rightChanged) n=entered[0];
    else if(rightChanged && !leftChanged) n=entered[1];
    else if(leftChanged) n=entered[0];
  }

  const lastBookPage=Math.max(0,pages.length-FRONT_MATTER_PAGES);
  if(Number.isInteger(n) && n>=0 && n<=lastBookPage) gotoIndex(bookPageToIndex(n));
  else syncPageUI();
}
function gotoIndex(target){
  const cards=cardsReal(); target = clamp(target,0,cards.length-1);
  currentIndex=target;
  syncPageUI();
  cards[target].scrollIntoView({behavior:'auto',block:'start'});

  // Si l'image visée termine son chargement juste après le saut, on recale
  // une fois la page. Cela évite qu'elle soit repoussée par les images qui
  // prennent leur hauteur définitive au même moment.
  const targetPage=pages[target];
  if(targetPage && !targetPage.imgDoc.complete){
    targetPage.imgDoc.addEventListener('load',()=>{
      requestAnimationFrame(()=>{
        const card=cardsReal()[target];
        if(card) card.scrollIntoView({behavior:'auto',block:'start'});
        currentIndex=target;
        syncPageUI();
      });
    },{once:true});
  }
}
function goto(by){
  const cards=cardsReal(); const top=window.scrollY+4; let best={idx:0,dy:1e9};
  cards.forEach((el,i)=>{ const r=el.getBoundingClientRect(); const y=r.top+window.scrollY; const dy=Math.abs(y-top); if(dy<best.dy) best={idx:i,dy}; });
  gotoIndex(best.idx+by);
}
function updateNavFromScroll(){
  const cards=cardsReal(); let best={idx:0,vis:0}; const vh=window.innerHeight;
  cards.forEach((el,i)=>{ const r=el.getBoundingClientRect(); const vis=Math.max(0,Math.min(r.bottom,vh)-Math.max(r.top,0)); if(vis>best.vis) best={idx:i,vis}; });

  // En double page, les deux pages ont exactement la même visibilité.
  // Si la page active appartient toujours à la double page visible, on la
  // conserve comme ancre au lieu de la remplacer systématiquement par celle
  // de gauche.
  if(layout==='2up' && cards[currentIndex] && cards[best.idx]){
    const currentSpread=cards[currentIndex].closest('.spread');
    const bestSpread=cards[best.idx].closest('.spread');
    if(currentSpread && currentSpread===bestSpread){ syncPageUI(); return; }
  }

  currentIndex=best.idx; syncPageUI();
}
let lastNavScrollY=window.scrollY, navScrollFrame=0;
function scheduleNavFromScroll(){
  const y=window.scrollY;
  if(y===lastNavScrollY) return;
  lastNavScrollY=y;
  if(navScrollFrame) return;
  navScrollFrame=requestAnimationFrame(()=>{
    navScrollFrame=0;
    updateNavFromScroll();
  });
}

/*** LIENS ***/
let LINKS_MAP = {};
function loadLinksFromJson(){
  fetch(LINKS_JSON_URL + '?v=' + Date.now(), {cache:'no-store'})
    .then(r=>r.ok?r.text():Promise.reject(r.status))
    .then(txt=>JSON.parse(txt.replace(/^\uFEFF/,'').trim()))
    .then(data=>{
      LINKS_MAP = data||{};
      for (const p of pages) mountLinksForPage(p);
      updateLinksInteractivity();
    })
    .catch(()=>{ LINKS_MAP={}; });
}
function updateLinkLayerScale(p){
  const natW = p.w, natH = p.h;
  const cssW = parseFloat(getComputedStyle(p.box).width);
  const cssH = parseFloat(getComputedStyle(p.box).height);
  const sx = cssW / natW, sy = cssH / natH;
  p.linksLayer.style.width  = natW + 'px';
  p.linksLayer.style.height = natH + 'px';
  p.linksLayer.style.transform = `scale(${sx}, ${sy})`;
}
function mountLinksForPage(p){
  if(!p.linksLayer){
    const layer=document.createElement('div');
    layer.className='linksLayer';
    p.linksLayer=layer;
    p.box.appendChild(layer);
    p.box.appendChild(p.canDr);
  }
  p.linksLayer.innerHTML='';
  const list = LINKS_MAP[String(p.idx)];
  if(!list || !list.length){ updateLinkLayerScale(p); return; }
  for(const [linkIndex,L] of list.entries()){
    const a=document.createElement('a');
    a.className='link-hotspot';
    const x=(L.xPct/100)*p.w, y=(L.yPct/100)*p.h, w=(L.wPct/100)*p.w, h=(L.hPct/100)*p.h;
    a.style.left=x+'px'; a.style.top=y+'px'; a.style.width=Math.max(1,w)+'px'; a.style.height=Math.max(1,h)+'px';
    if(L.title) a.title=L.title;
    if(L.kind==='external' && L.href){ a.href=L.href; a.target='_blank'; a.rel='noopener'; }
    else if(L.kind==='internal' && L.gotoPage){
      a.href='#p'+L.gotoPage; a.dataset.goto=String(L.gotoPage);
      a.addEventListener('click',(e)=>{ e.preventDefault(); if(LINK_EDITOR) return; if(drawMode) toggleDrawMode(false); gotoIndex(bookPageToIndex(parseInt(a.dataset.goto,10))); });
    }
    if(LINK_EDITOR){
      a.classList.add('dbg');
      a.addEventListener('click',(e)=>{
        e.preventDefault();
        e.stopPropagation();
        selectEncodedLink(String(p.idx),linkIndex);
      });
      if(selectedLink?.key===String(p.idx) && selectedLink.index===linkIndex) a.classList.add('selected');
    }
    p.linksLayer.appendChild(a);
  }
  updateLinkLayerScale(p);
}
function updateLinksInteractivity(){
  for(const p of pages){
    if(!p.linksLayer) continue;
    p.linksLayer.classList.toggle('links-hidden', !linksVisible);
    p.linksLayer.classList.toggle('links-blocked', drawMode || !!annotationTool || linkDrawMode);
    p.canDr.style.pointerEvents = (drawMode || annotationTool || linkDrawMode) ? 'auto' : 'none';
  }
  updatePanState();
}
function selectEncodedLink(key,index){
  const list=LINKS_MAP[key]||[];
  if(!list[index]) return;
  selectedLink={key,index};
  for(const p of pages) if(p.linksLayer) mountLinksForPage(p);
  $linkDeleteSelected.disabled=false;
  const L=list[index];
  const destination=L.kind==='internal'?`la page ${L.gotoPage}`:(L.href||'ce lien');
  $linkEditorInfo.textContent=`Lien sélectionné sur la ${pageLabelFromPhysical(+key)} vers ${destination}.`;
}
function clearSelectedLink(){
  selectedLink=null;
  if($linkDeleteSelected) $linkDeleteSelected.disabled=true;
}
function deleteSelectedLink(){
  if(!selectedLink){
    $linkEditorInfo.textContent='Active les liens, puis clique sur la zone à supprimer.';
    return;
  }
  const {key,index}=selectedLink;
  const list=LINKS_MAP[key]||[];
  if(!list[index]){ clearSelectedLink(); return; }
  list.splice(index,1);
  if(!list.length) delete LINKS_MAP[key];
  clearSelectedLink();
  const p=pages.find(x=>String(x.idx)===key); if(p) mountLinksForPage(p);
  toggleLinks(true);
  $linkEditorInfo.textContent=`Lien supprimé de la ${pageLabelFromPhysical(+key)}. Tu peux maintenant en tracer un nouveau.`;
}
function toggleLinks(on){
  linksVisible=!!on;
  if(linksVisible){
    toggleDrawMode(false);
    setAnnotationTool(null);
    linkDrawMode=false;
    if($linkDraw) $linkDraw.textContent='Tracer la zone du lien';
  }
  $linksToggle.textContent=linksVisible?'Désactiver les liens':'Activer les liens';
  $linksToggle.classList.toggle('btn-dark',linksVisible);
  updateLinksInteractivity();
}
function toggleDrawMode(on){
  drawMode = on;
  if(drawMode){
    setAnnotationTool(null);
    linksVisible=false;
    linkDrawMode=false;
    $linksToggle.textContent='Activer les liens';
    $linksToggle.classList.remove('btn-dark');
  }
  $toggleRect.textContent='Locales : ' + (drawMode?'ON':'OFF');
  $toggleRect.classList.toggle('btn-dark',drawMode);
  updateLinksInteractivity();
}

const TOOL_LABELS={select:'Sélectionner / déplacer',highlight:'Surligneur',freehand:'Dessin libre',rectangle:'Rectangle',ellipse:'Cercle',line:'Ligne',text:'Texte'};
const TOOL_HINTS={

function addEncodedLink(p,r){
  const target=$linkTarget.value.trim();
  const kind=$linkKind.value;
  const link={
    kind,
    xPct:+((r.x/p.w)*100).toFixed(4), yPct:+((r.y/p.h)*100).toFixed(4),

function exportLinksFile(){
  const ordered={}; Object.keys(LINKS_MAP).sort((a,b)=>+a-+b).forEach(k=>{ if(LINKS_MAP[k]?.length) ordered[k]=LINKS_MAP[k]; });
  const content=JSON.stringify(ordered,null,2)+'\n';
  const url=URL.createObjectURL(new Blob([content],{type:'application/json;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='links.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);

/*** CORRECTIONS ***/
function redrawOverlay(p){
  const ctx=p.canOv.getContext('2d');
  ctx.clearRect(0,0,p.w,p.h);
  if(p.imgCorr){
    const corrW=p.corrNW||p.imgCorr.naturalWidth||p.w;
    const corrH=p.corrNH||p.imgCorr.naturalHeight||p.h;
    if(p.showAll){
      ctx.drawImage(p.imgCorr,0,0,corrW,corrH,0,0,p.w,p.h);
    }else if(p.zones?.length){
      const sX=p.w/corrW, sY=p.h/corrH;
      for(const r of p.zones){
        const sx=r.x/sX, sy=r.y/sY, sw=r.w/sX, sh=r.h/sY;
        ctx.drawImage(p.imgCorr,sx,sy,sw,sh,r.x,r.y,r.w,r.h);
      }
    }
  }
  for(const annotation of p.annotations||[]) drawAnnotation(ctx,annotation);
}
function wrappedTextLines(ctx,text,maxWidth){
  const result=[];
  for(const paragraph of String(text||'').split(/\r?\n/)){
    const words=paragraph.trim().split(/\s+/).filter(Boolean);
    if(!words.length){ result.push(''); continue; }
    let line=words.shift();
    for(const word of words){
      const candidate=line+' '+word;
      if(ctx.measureText(candidate).width<=maxWidth) line=candidate;
      else { result.push(line); line=word; }
    }
    result.push(line);
  }
  return result;
}
function drawAnnotation(ctx,a){
  if(!a||pendingTextAnnotation?.annotation===a) return;
  ctx.save();
  ctx.strokeStyle=a.color||'#ffe100';
  ctx.fillStyle=a.color||'#ffe100';
  ctx.lineCap='round';
  ctx.lineJoin='round';
  if(a.kind==='highlight'){
    ctx.globalAlpha=HIGHLIGHT_OPACITY;
    ctx.lineWidth=a.width||HIGHLIGHT_WIDTH_PX;
    ctx.beginPath(); ctx.moveTo(a.x1,a.y); ctx.lineTo(a.x2,a.y); ctx.stroke();
  }else if(a.kind==='freehand'){
    const points=a.points||[];
    if(points.length){
      ctx.lineWidth=a.width||DRAW_WIDTH_PX;
      ctx.beginPath(); ctx.moveTo(points[0].x,points[0].y);
      for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
      if(points.length===1) ctx.lineTo(points[0].x+.1,points[0].y+.1);
      ctx.stroke();
    }
  }else if(a.kind==='line'){
    ctx.lineWidth=a.width||DRAW_WIDTH_PX;
    ctx.beginPath(); ctx.moveTo(a.x1,a.y1); ctx.lineTo(a.x2,a.y2); ctx.stroke();
  }else if(a.kind==='rectangle'){
    ctx.lineWidth=a.widthLine||DRAW_WIDTH_PX;
    ctx.strokeRect(a.x,a.y,a.w,a.h);
  }else if(a.kind==='ellipse'){
    ctx.lineWidth=a.widthLine||DRAW_WIDTH_PX;
    ctx.beginPath(); ctx.ellipse(a.x+a.w/2,a.y+a.h/2,Math.abs(a.w/2),Math.abs(a.h/2),0,0,Math.PI*2); ctx.stroke();
  }else if(a.kind==='text'){
    const size=a.fontSize||DEFAULT_TEXT_FONT_PX;
    const lineHeight=Math.round(size*1.22);
    ctx.font=`${size}px Calibri, Carlito, "Segoe UI", sans-serif`;
    ctx.textBaseline='top';
    ctx.beginPath(); ctx.rect(a.x,a.y,a.w,a.h); ctx.clip();
    const lines=wrappedTextLines(ctx,a.text,Math.max(10,a.w));
    lines.forEach((line,i)=>ctx.fillText(line,a.x,a.y+i*lineHeight));
  }
  ctx.restore();
}
function cloneAnnotation(annotation){
  return JSON.parse(JSON.stringify(annotation));
}
function restoreAnnotation(annotation,snapshot){
  for(const key of Object.keys(annotation)) delete annotation[key];
  Object.assign(annotation,cloneAnnotation(snapshot));
}
function annotationBounds(a){
  if(!a) return null;
  if(a.kind==='highlight'){
    const half=(a.width||HIGHLIGHT_WIDTH_PX)/2;
    return {x:Math.min(a.x1,a.x2),y:a.y-half,w:Math.abs(a.x2-a.x1),h:half*2};
  }
  if(a.kind==='line'){
    return {x:Math.min(a.x1,a.x2),y:Math.min(a.y1,a.y2),w:Math.abs(a.x2-a.x1),h:Math.abs(a.y2-a.y1)};
  }
  if(a.kind==='freehand'){
    const points=a.points||[];
    if(!points.length) return null;
    const xs=points.map(point=>point.x), ys=points.map(point=>point.y);
    return {x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
  }
  if(['rectangle','ellipse','text'].includes(a.kind)) return {x:a.x,y:a.y,w:a.w,h:a.h};
  return null;
}
function distanceToSegment(point,a,b){
  const dx=b.x-a.x, dy=b.y-a.y;
  if(!dx&&!dy) return Math.hypot(point.x-a.x,point.y-a.y);
  const t=clamp(((point.x-a.x)*dx+(point.y-a.y)*dy)/(dx*dx+dy*dy),0,1);
  return Math.hypot(point.x-(a.x+t*dx),point.y-(a.y+t*dy));
}
function localUiSize(p,cssPixels){
  const r=p.canDr.getBoundingClientRect();
  const scale=landscapeMode ? r.height/p.w : r.width/p.w;
  return cssPixels/Math.max(scale,.01);
}
function annotationContainsPoint(p,a,point){
  const tolerance=localUiSize(p,10);
  if(a.kind==='line') return distanceToSegment(point,{x:a.x1,y:a.y1},{x:a.x2,y:a.y2})<=tolerance+(a.width||DRAW_WIDTH_PX)/2;
  if(a.kind==='highlight'){
    const left=Math.min(a.x1,a.x2)-tolerance, right=Math.max(a.x1,a.x2)+tolerance;
    return point.x>=left&&point.x<=right&&Math.abs(point.y-a.y)<=(a.width||HIGHLIGHT_WIDTH_PX)/2+tolerance;
  }
  if(a.kind==='freehand'){
    const points=a.points||[];
    for(let i=1;i<points.length;i++) if(distanceToSegment(point,points[i-1],points[i])<=tolerance+(a.width||DRAW_WIDTH_PX)/2) return true;
    return points.length===1&&Math.hypot(point.x-points[0].x,point.y-points[0].y)<=tolerance;
  }
  const b=annotationBounds(a);
  return !!b&&point.x>=b.x-tolerance&&point.x<=b.x+b.w+tolerance&&point.y>=b.y-tolerance&&point.y<=b.y+b.h+tolerance;
}
function findAnnotationAt(p,point){
  const list=p.annotations||[];
  for(let i=list.length-1;i>=0;i--) if(annotationContainsPoint(p,list[i],point)) return list[i];
  return null;
}
function isResizableAnnotation(a){
  return !!a&&['rectangle','ellipse','text'].includes(a.kind);
}
function annotationHandles(a){
  if(!isResizableAnnotation(a)) return [];
  const b=annotationBounds(a);
  return [
    {name:'nw',x:b.x,y:b.y},{name:'ne',x:b.x+b.w,y:b.y},
    {name:'se',x:b.x+b.w,y:b.y+b.h},{name:'sw',x:b.x,y:b.y+b.h}
  ];
}
function handleAtPoint(p,a,point){
  const radius=localUiSize(p,12);
  return annotationHandles(a).find(handle=>Math.hypot(point.x-handle.x,point.y-handle.y)<=radius)||null;
}
function drawSelectedAnnotation(p,ctx){
  if(!selectedAnnotation||selectedAnnotation.p!==p||annotationTool!=='select') return;
  const a=selectedAnnotation.annotation;
  const b=annotationBounds(a);
  if(!b) return;
  const lineWidth=localUiSize(p,2);
  const radius=localUiSize(p,6);
  ctx.save();
  ctx.strokeStyle='#2563eb';
  ctx.fillStyle='#fff';
  ctx.lineWidth=lineWidth;
  ctx.setLineDash([localUiSize(p,7),localUiSize(p,5)]);
  ctx.strokeRect(b.x,b.y,Math.max(b.w,lineWidth),Math.max(b.h,lineWidth));
  ctx.setLineDash([]);
  for(const handle of annotationHandles(a)){
    ctx.beginPath(); ctx.rect(handle.x-radius,handle.y-radius,radius*2,radius*2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function clearSelectedAnnotation(redraw=true){
  const previous=selectedAnnotation?.p;
  selectedAnnotation=null;
  if(redraw&&previous) redrawDraft(previous,null);
}
function selectAnnotation(p,annotation){
  const previous=selectedAnnotation?.p;
  selectedAnnotation=annotation?{p,annotation}:null;
  if(previous&&previous!==p) redrawDraft(previous,null);
  redrawDraft(p,null);
  if(annotation?.color){
    annotationColor=annotation.color;
    document.querySelectorAll('.colorChoice').forEach(choice=>choice.classList.toggle('selected',choice.dataset.color===annotationColor));
  }
  if(annotation?.kind==='text'){
    annotationFontSize=clamp(parseInt(annotation.fontSize,10)||DEFAULT_TEXT_FONT_PX,12,80);
    $annotationFontSize.value=String(annotationFontSize);
  }
}
function translateAnnotation(annotation,dx,dy){
  if(['rectangle','ellipse','text'].includes(annotation.kind)){ annotation.x+=dx; annotation.y+=dy; return; }
  if(annotation.kind==='highlight'){ annotation.x1+=dx; annotation.x2+=dx; annotation.y+=dy; return; }
  if(annotation.kind==='line'){ annotation.x1+=dx; annotation.x2+=dx; annotation.y1+=dy; annotation.y2+=dy; return; }
  if(annotation.kind==='freehand') for(const point of annotation.points||[]){ point.x+=dx; point.y+=dy; }
}
function moveAnnotationFromSnapshot(p,annotation,snapshot,dx,dy){
  restoreAnnotation(annotation,snapshot);
  const b=annotationBounds(annotation);
  dx=clamp(dx,-b.x,p.w-(b.x+b.w));
  dy=clamp(dy,-b.y,p.h-(b.y+b.h));
  translateAnnotation(annotation,dx,dy);
}
function resizeAnnotationFromSnapshot(p,annotation,snapshot,handle,point){
  restoreAnnotation(annotation,snapshot);
  const b=annotationBounds(snapshot);
  const minSize=localUiSize(p,24);
  let left=b.x, top=b.y, right=b.x+b.w, bottom=b.y+b.h;
  if(handle.includes('w')) left=clamp(point.x,0,right-minSize);
  if(handle.includes('e')) right=clamp(point.x,left+minSize,p.w);
  if(handle.includes('n')) top=clamp(point.y,0,bottom-minSize);
  if(handle.includes('s')) bottom=clamp(point.y,top+minSize,p.h);
  annotation.x=left; annotation.y=top; annotation.w=right-left; annotation.h=bottom-top;
}
function redrawDraft(p,d){
  const ctx=p.canDr.getContext('2d');
  ctx.clearRect(0,0,p.w,p.h);
  drawSelectedAnnotation(p,ctx);
  if(!d) return;
  if(d.kind==='highlight'){
    ctx.save();
    ctx.globalAlpha=HIGHLIGHT_OPACITY;
    ctx.strokeStyle=d.color||annotationColor;
    ctx.lineWidth=HIGHLIGHT_WIDTH_PX;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(d.x,d.y);
    ctx.lineTo(d.x2,d.y);
    ctx.stroke();
    ctx.restore();
    return;
  }
  if(d.kind==='freehand'||d.kind==='line'||d.kind==='rectangle'||d.kind==='ellipse'){
    drawAnnotation(ctx,d);
    return;
  }
  if(d.kind==='text'){
    ctx.save();
    ctx.setLineDash([12,8]); ctx.strokeStyle=d.color||annotationColor; ctx.lineWidth=3;
    ctx.strokeRect(d.x,d.y,d.w,d.h);
    ctx.restore();
    return;
  }
  ctx.setLineDash([]); ctx.strokeStyle='#9CA3AF'; ctx.lineWidth=3;
  const x=d.w>=0?d.x:d.x+d.w, y=d.h>=0?d.y:d.y+d.h;
  ctx.strokeRect(x,y,Math.abs(d.w),Math.abs(d.h));
}
function normalizedBox(d){
  return {x:d.w>=0?d.x:d.x+d.w,y:d.h>=0?d.y:d.y+d.h,w:Math.abs(d.w),h:Math.abs(d.h)};
}
function commitAnnotation(p,annotation){
  p.annotations.push(annotation);
  historyStack.push({type:'annotation',page:p,annotation});
  $undo.disabled=false;
  saveAnnotations();
  redrawOverlay(p);
}
function updateInlineTextEditorScale(){
  if(!pendingTextAnnotation?.element) return;
  const {element,annotation}=pendingTextAnnotation;
  const scale=cssScaleFromPct();
  element.style.fontSize=Math.max(8,annotation.fontSize*scale)+'px';
}
function finishInlineTextEditor(save=true){
  if(!pendingTextAnnotation) return;
  const pending=pendingTextAnnotation;
  pendingTextAnnotation=null;
  const text=pending.element.value.trim();
  pending.element.remove();
  redrawDraft(pending.p,null);
  if(save && text){
    pending.annotation.text=text;
    if(pending.isNew){
      commitAnnotation(pending.p,pending.annotation);
    }else{
      historyStack.push({type:'annotation-transform',page:pending.p,annotation:pending.annotation,before:pending.before});
      $undo.disabled=false;
      saveAnnotations();
      redrawOverlay(pending.p);
    }
    setAnnotationTool('select');
    selectAnnotation(pending.p,pending.annotation);
  }else if(!pending.isNew){
    restoreAnnotation(pending.annotation,pending.before);
    redrawOverlay(pending.p);
  }
}
function openInlineTextEditor(p,annotation,isNew=true){
  if(pendingTextAnnotation) finishInlineTextEditor(true);
  redrawDraft(p,null);
  const textarea=document.createElement('textarea');
  textarea.className='inlineTextEditor';
  textarea.placeholder='Écris ici…';
  textarea.setAttribute('aria-label','Texte de l’annotation');
  textarea.style.left=(annotation.x/p.w*100)+'%';
  textarea.style.top=(annotation.y/p.h*100)+'%';
  textarea.style.width=(annotation.w/p.w*100)+'%';
  textarea.style.height=(annotation.h/p.h*100)+'%';
  textarea.style.color=annotation.color;
  textarea.value=isNew?'':(annotation.text||'');
  p.box.appendChild(textarea);
  pendingTextAnnotation={p,annotation,element:textarea,isNew,before:cloneAnnotation(annotation)};
  redrawOverlay(p);
  updateInlineTextEditorScale();
  textarea.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      e.preventDefault();
      finishInlineTextEditor(false);
    }else if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
      e.preventDefault();
      finishInlineTextEditor(true);
    }
  });
  textarea.addEventListener('blur',()=>finishInlineTextEditor(true),{once:true});
  requestAnimationFrame(()=>{textarea.focus(); if(!isNew) textarea.setSelectionRange(textarea.value.length,textarea.value.length);});
}
function attachDrawHandlers(p){
  let draft=null;
  let selectionGesture=null;
  const toLocal=e=>{
    const r=p.canDr.getBoundingClientRect();
    if(landscapeMode){
      return {
        x:(e.clientY-r.top)*(p.w/r.height),
        y:(r.right-e.clientX)*(p.h/r.width)
      };
    }
    return {x:(e.clientX-r.left)*(p.w/r.width),y:(e.clientY-r.top)*(p.h/r.height)};
  };
  function down(e){
    if(!drawMode&&!annotationTool&&!linkDrawMode) return;
    if(e.button!==undefined&&e.button!==0) return;
    e.preventDefault();
    if(pendingTextAnnotation){ finishInlineTextEditor(true); return; }
    const start=toLocal(e);
    if(annotationTool==='select'){
      const current=selectedAnnotation?.p===p?selectedAnnotation.annotation:null;
      const handle=current?handleAtPoint(p,current,start):null;
      const hit=handle?current:findAnnotationAt(p,start);
      if(!hit){ clearSelectedAnnotation(); return; }
      selectAnnotation(p,hit);
      selectionGesture={
        annotation:hit,
        before:cloneAnnotation(hit),
        start,
        handle:handle?.name||null,
        changed:false
      };
      document.body.classList.add('annotation-dragging');
      return;
    }
    if(annotationTool==='highlight') draft={kind:'highlight',x:start.x,y:start.y,x2:start.x,color:annotationColor,width:HIGHLIGHT_WIDTH_PX};
    else if(annotationTool==='freehand') draft={kind:'freehand',points:[start],color:annotationColor,width:DRAW_WIDTH_PX};
    else if(annotationTool==='line') draft={kind:'line',x1:start.x,y1:start.y,x2:start.x,y2:start.y,color:annotationColor,width:DRAW_WIDTH_PX};
    else if(annotationTool) draft={kind:annotationTool,x:start.x,y:start.y,w:0,h:0,color:annotationColor,widthLine:DRAW_WIDTH_PX};
    else { draft=start; draft.w=0; draft.h=0; }
    redrawDraft(p,draft);
  }
  function move(e){
    if(selectionGesture){
      const point=toLocal(e);
      if(selectionGesture.handle) resizeAnnotationFromSnapshot(p,selectionGesture.annotation,selectionGesture.before,selectionGesture.handle,point);
      else moveAnnotationFromSnapshot(p,selectionGesture.annotation,selectionGesture.before,point.x-selectionGesture.start.x,point.y-selectionGesture.start.y);
      selectionGesture.changed=Math.hypot(point.x-selectionGesture.start.x,point.y-selectionGesture.start.y)>1;
      redrawOverlay(p);
      redrawDraft(p,null);
      return;
    }
    if((!drawMode&&!annotationTool&&!linkDrawMode)||!draft) return;
    const m=toLocal(e);
    if(draft.kind==='highlight') draft.x2=clamp(m.x,0,p.w);
    else if(draft.kind==='freehand'){
      const last=draft.points[draft.points.length-1];
      if(!last||Math.hypot(m.x-last.x,m.y-last.y)>2) draft.points.push({x:clamp(m.x,0,p.w),y:clamp(m.y,0,p.h)});
    }
    else if(draft.kind==='line'){ draft.x2=clamp(m.x,0,p.w); draft.y2=clamp(m.y,0,p.h); }
    else { draft.w=m.x-draft.x; draft.h=m.y-draft.y; }
    redrawDraft(p,draft);
  }
  function up(){
    if(selectionGesture){
      const gesture=selectionGesture;
      selectionGesture=null;
      document.body.classList.remove('annotation-dragging');
      if(gesture.changed){
        historyStack.push({type:'annotation-transform',page:p,annotation:gesture.annotation,before:gesture.before});
        $undo.disabled=false;
        saveAnnotations();
      }
      redrawOverlay(p);
      redrawDraft(p,null);
      return;
    }
    if((!drawMode&&!annotationTool&&!linkDrawMode)||!draft) return;
    if(draft.kind==='highlight'){
      const line={
        kind:'highlight',
        x1:clamp(draft.x,0,p.w),
        x2:clamp(draft.x2,0,p.w),
        y:clamp(draft.y,0,p.h),
        width:HIGHLIGHT_WIDTH_PX,
        color:draft.color
      };
      draft=null;
      if(Math.abs(line.x2-line.x1)>6) commitAnnotation(p,line);
      redrawDraft(p,null);
      return;
    }
    if(draft.kind==='freehand'){
      const annotation=draft; draft=null;
      if(annotation.points.length>1) commitAnnotation(p,annotation);
      redrawDraft(p,null); return;
    }
    if(draft.kind==='line'){
      const annotation=draft; draft=null;
      if(Math.hypot(annotation.x2-annotation.x1,annotation.y2-annotation.y1)>6) commitAnnotation(p,annotation);
      redrawDraft(p,null); return;
    }
    const r=normalizedBox(draft);
    if(draft.kind==='rectangle'||draft.kind==='ellipse'||draft.kind==='text'){
      const kind=draft.kind, color=draft.color, widthLine=draft.widthLine;
      draft=null;
      if(r.w>10&&r.h>10){
        const annotation={kind,color,x:r.x,y:r.y,w:r.w,h:r.h,widthLine};
        if(kind==='text'){
          annotation.fontSize=annotationFontSize;
          openInlineTextEditor(p,annotation);
          return;
        }
        commitAnnotation(p,annotation);
      }
      redrawDraft(p,null); return;
    }
    draft=null;
    if(r.w>6 && r.h>6){
      if(linkDrawMode) addEncodedLink(p,r);
      else { p.zones.push(r); historyStack.push({type:'correction',page:p,rect:r}); $undo.disabled=historyStack.length===0; redrawOverlay(p); }
    }
    redrawDraft(p,null);
  }
  p.canDr.addEventListener('mousedown',down);
  p.canDr.addEventListener('dblclick',e=>{
    if(annotationTool!=='select') return;
    const annotation=findAnnotationAt(p,toLocal(e));
    if(annotation?.kind!=='text') return;
    e.preventDefault();
    selectAnnotation(p,annotation);
    openInlineTextEditor(p,annotation,false);
  });
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
}

function updateRevealButton(){

function makePage(n){
  const el=document.createElement('div'); el.className='page';
  const pageLabel=pageLabelFromPhysical(n);
  const badge=document.createElement('div'); badge.className='badge'; badge.textContent=pageLabel[0].toUpperCase()+pageLabel.slice(1); el.appendChild(badge);
  const box=document.createElement('div'); box.className='box'; el.appendChild(box);

  const img=document.createElement('img'); img.alt=pageLabel[0].toUpperCase()+pageLabel.slice(1); img.decoding='async'; img.loading='lazy'; img.draggable=false; img.src=docPath(n); box.appendChild(img);

  const canOv=document.createElement('canvas'); canOv.className='ov';
  const canDr=document.createElement('canvas'); canDr.className='dr';
  box.appendChild(canOv);

  const linksLayer=document.createElement('div'); linksLayer.className='linksLayer'; box.appendChild(linksLayer);
  box.appendChild(canDr);

  const savedAnnotations=Array.isArray(storedAnnotations[String(n)]) ? storedAnnotations[String(n)] : [];
  const p={idx:n,box,imgDoc:img,imgCorr:null,canOv,canDr,w:0,h:0,zones:[],annotations:savedAnnotations,showAll:false,elPage:el,corrNW:0,corrNH:0,linksLayer};
  pages.push(p);

  const corr=new Image(); corr.decoding='async'; corr.loading='eager'; corr.fetchPriority='high';
  function onCorrLoaded(){ p.imgCorr=corr; p.corrNW=corr.naturalWidth||0; p.corrNH=corr.naturalHeight||0; corrReadyCount++; updateRevealButton(); }
  corr.addEventListener('load',()=>{ if(typeof corr.decode==='function'){ corr.decode().then(onCorrLoaded).catch(onCorrLoaded);} else onCorrLoaded(); });
  corr.addEventListener('error',()=>{ corrReadyCount++; updateRevealButton(); });
  corr.src=corrPath(n);
  if(corr.complete){ if(typeof corr.decode==='function'){ corr.decode().then(onCorrLoaded).catch(onCorrLoaded);} else onCorrLoaded(); }

  img.addEventListener('error',()=>{ el.classList.add('missing'); const warn=document.createElement('div'); warn.className='badge warn'; warn.textContent='Fichier manquant'; el.appendChild(warn); });
  img.addEventListener('load',()=>{ 
    p.w=img.naturalWidth; p.h=img.naturalHeight;
    canOv.width=canDr.width=p.w; canOv.height=canDr.height=p.h;
    if(!firstPageWidth){
      firstPageWidth=p.w;
      firstPageHeight=p.h;

      // Toutes les pages occupent immédiatement leur place dans le document,
      // même si leurs PNG restent chargés progressivement par le navigateur.
      // La navigation peut donc atteindre directement une page éloignée.
      for(const other of pages){
        if(!other.w || !other.h){
          other.w=firstPageWidth;
          other.h=firstPageHeight;
        }
      }
      refreshFitWidthPct();
    }
    applyZoom();
    redrawOverlay(p); redrawDraft(p,null);
    attachDrawHandlers(p);
    mountLinksForPage(p);
    updateLinksInteractivity();
    updateLinkLayerScale(p);
  });

  const cap=document.createElement('div'); cap.className='num'; cap.textContent=displayNumberFromPhysical(n); el.appendChild(cap);
  return el;
}

function mount1up(){ $viewport.className='flow-1up'; $viewport.innerHTML=''; for(const p of pages){ $viewport.appendChild(p.elPage); } }
function mount2up(){
  $viewport.className='flow-2up'; $viewport.innerHTML='';

    const s1=document.createElement('div'); s1.className='spread'; s1.appendChild(spacer); s1.appendChild(pages[0].elPage); $viewport.appendChild(s1);
    for (let i=1;i<pages.length;i+=2){ const sp=document.createElement('div'); sp.className='spread'; sp.appendChild(pages[i].elPage); if(pages[i+1]) sp.appendChild(pages[i+1].elPage); $viewport.appendChild(sp); }
  } else {

function updateLayoutButtons(){
  const onePageActive=layout==='1up';
  $mode1.classList.toggle('btn-view-active',onePageActive);
  $mode2.classList.toggle('btn-view-active',!onePageActive);
  $mode1.setAttribute('aria-pressed',String(onePageActive));
  $mode2.setAttribute('aria-pressed',String(!onePageActive));
  $landscape.classList.toggle('btn-view-active',landscapeMode);
  $landscape.setAttribute('aria-pressed',String(landscapeMode));
}

function toggleLandscapeMode(){
  const preservedIndex=clamp(currentIndex,0,Math.max(0,pages.length-1));
  landscapeMode=!landscapeMode;
  updateLayoutButtons();
  refreshFitWidthPct();
  applyZoom();
  currentIndex=preservedIndex;
  requestAnimationFrame(()=>{
    const card=cardsReal()[preservedIndex];
    if(!card) return;
    const target=layout==='2up'?(card.closest('.spread')||card):card;
    target.scrollIntoView({behavior:'auto',block:'start'});
    currentIndex=preservedIndex;
    syncPageUI();
  });
}

function rebuild(){
  // La position verticale ne représente plus la même page après un passage
  // de 1 à 2 pages (ou inversement). On mémorise donc la page active, puis on
  // rejoint la page ou la double page qui la contient après reconstruction.
  const preservedIndex=clamp(currentIndex,0,Math.max(0,pages.length-1));
  if(layout==='1up') mount1up(); else mount2up();
  updateLayoutButtons();
  refreshFitWidthPct();
  applyZoom();
  currentIndex=preservedIndex;
  syncPageUI();
  requestAnimationFrame(()=>{
    const cards=cardsReal();
    const card=cards[preservedIndex];
    if(!card) return;
    const target=layout==='2up' ? (card.closest('.spread')||card) : card;
    target.scrollIntoView({behavior:'auto',block:'start'});
    currentIndex=preservedIndex;
    syncPageUI();
  });
}

/*** DÉCOUVERTE AUTO DES PAGES ***/
function testImage(url){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>resolve(true);
    img.onerror=()=>resolve(false);
    img.src=url+'?v='+Date.now();
  });
}
async function discoverPages(max=500){
  const list=[];
  for(let n=1;n<=max;n++){
    const ok = await testImage(docPath(n));
    if(!ok) break;           // arrêt à la première manquante
    list.push(n);
  }
  return list;
}
async function getPagesList(){
  // manifest.json prioritaire s’il existe
  try{
    const res=await fetch('./manifest.json?v='+Date.now(),{cache:'no-store'});
    if(res.ok){
      const m=await res.json();
      if(m && Array.isArray(m.pages) && m.pages.length) return m.pages;
    }
  }catch(_){}
  // sinon découverte auto
  return await discoverPages(500);
}

    }
  });
  document.querySelectorAll('.annotationTool').forEach(button=>button.addEventListener('click',()=>{
    setAnnotationTool(button.dataset.tool);
    $annotationPopup.classList.remove('open');
  }));
  $stopAnnotation.addEventListener('click',()=>setAnnotationTool(null));
  $clearAnnotations.addEventListener('click',()=>{
    if(!confirm('Effacer toutes les annotations enregistrées dans cette liseuse ?')) return;
    if(pendingTextAnnotation) finishInlineTextEditor(false);
    clearSelectedAnnotation(false);
    for(const p of pages){ p.annotations=[]; redrawOverlay(p); redrawDraft(p,null); }
    for(let i=historyStack.length-1;i>=0;i--) if(historyStack[i].type==='annotation'||historyStack[i].type==='annotation-transform') historyStack.splice(i,1);
    $undo.disabled=historyStack.length===0;
    saveAnnotations();
  });
  $undo.addEventListener('click', doUndo);
  $undo.disabled = true;
  function doUndo(){
    const allShown=!!pages[0]?.showAll;
    if(allShown){ for(const p of pages){ p.showAll=false; redrawOverlay(p); } document.getElementById('revealAll').textContent='Tout révéler'; }
    const last=historyStack.pop(); if(!last){ $undo.disabled=true; return; }
    if(last.type==='annotation'){
      const i=last.page.annotations.lastIndexOf(last.annotation);
      if(i!==-1) last.page.annotations.splice(i,1);
      saveAnnotations();
      redrawOverlay(last.page);
      if(selectedAnnotation?.annotation===last.annotation) clearSelectedAnnotation();
    }else if(last.type==='annotation-transform'){
      restoreAnnotation(last.annotation,last.before);
      saveAnnotations();
      redrawOverlay(last.page);
      redrawDraft(last.page,null);
    }else{
      const i=last.page.zones.lastIndexOf(last.rect);
      if(i!==-1) last.page.zones.splice(i,1);
      redrawOverlay(last.page);
    }
    $undo.disabled=historyStack.length===0;
  }

  document.getElementById('revealAll').addEventListener('click',()=>{ if(!revealReady) return; const reveal=!pages[0]?.showAll; for(const p of pages){ p.showAll=reveal; redrawOverlay(p); } document.getElementById('revealAll').textContent=reveal?'Masquer tout':'Tout révéler'; });

  $viewport.addEventListener('contextmenu',e=>e.preventDefault());
});
</script>
</body>
</html>

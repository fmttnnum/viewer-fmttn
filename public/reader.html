<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>FMttn — Liseuse PDF + Corrections</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{ --gap:24px; --gutter:18px; --bg:#f5f6f8; --ink:#111; --panelW:270px; --warn:#ef4444; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{ margin:0; font:14px/1.45 system-ui,Arial; background:var(--bg); color:var(--ink);
        overflow-y:scroll; overflow-x:hidden; }

  .wrap{ width:100%; margin:0; padding:12px; padding-right:calc(var(--panelW) + 24px) }
  #viewport{ margin-top:8px; display:flex; flex-direction:column; align-items:center; }
  .flow-1up{display:block}
  .flow-1up .page{margin:0 0 var(--gap) 0;}
  .flow-2up{display:block}
  .spread{ display:flex; justify-content:center; align-items:flex-start; column-gap:var(--gutter); margin:0 0 var(--gap) 0 }

  .page{ position:relative; display:block; background:#fff; box-shadow:0 10px 30px rgba(0,0,0,.08);
         border-radius:8px; width:fit-content; }
  .page.missing{ outline:3px solid var(--warn); }
  .spacer{background:transparent; box-shadow:none; border:1px dashed #e5e7eb}
  .box{position:relative; display:inline-block; will-change:width,height}
  .page img{display:block;max-width:100%;height:auto;user-select:none;-webkit-user-drag:none}

  /* calques */
  .ov{position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:1}
  .dr{position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:3}

  /* couche des liens : coordonnées en px natifs + scale CSS */
  .linksLayer{ position:absolute; left:0; top:0; width:0; height:0; z-index:2; pointer-events:auto; transform-origin:top left; }
  .linksLayer.links-blocked{ pointer-events:none; }
  .link-hotspot{ position:absolute; display:block; outline:none; border:0; background:transparent; }
  .linksLayer:not(.links-blocked) .link-hotspot{ cursor:pointer; }
  .link-hotspot.dbg{ background:rgba(255,200,0,.18); border:1px dashed rgba(255,200,0,.55); }

  /* panneau */
  .side{ position:fixed; top:12px; right:12px; bottom:12px; width:var(--panelW); background:#fff; border:1px solid #e5e7eb;
         border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:10px; padding:10px;
         z-index:20; overflow:auto; transition:transform .2s, box-shadow .2s; }
  .side.collapsed{ transform:translateX(calc(100% + 40px)); box-shadow:none; }
  .header{display:flex; justify-content:center; align-items:center}
  .title{font-weight:800}
  .section{border:1px solid #e5e7eb;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .btn{ position:relative; border:1px solid #d1d5db; background:#fff; padding:6px 10px; border-radius:8px; cursor:pointer; user-select:none; overflow:hidden; }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-dark{background:#111;color:#fff;border-color:#111}
  .btn-amber{background:#ffd166;border-color:#e9b44e}
  .btn:active::after{content:""; position:absolute; inset:0; background:rgba(0,0,0,.08);}
  .pill{padding:6px 10px;border-radius:999px;background:#f3f4f6;border:1px solid #e5e7eb;min-width:44px;text-align:center}
  .jump{width:74px;padding:6px 8px;border:1px solid #d1d5db;border-radius:8px}
  .toggler{ position:fixed; right:12px; top:12px; background:#111; color:#fff; border:none; border-radius:10px; padding:8px 10px; cursor:pointer; z-index:21 }
  #zoomSlider{ appearance:none; height:6px; border-radius:999px; background:#e5e7eb; width:160px; margin-left:8px; }
  #zoomSlider::-webkit-slider-thumb{ appearance:none; width:16px; height:16px; border-radius:999px; background:#111; cursor:pointer; }
  #zoomSlider::-moz-range-thumb{ width:16px; height:16px; border-radius:999px; background:#111; cursor:pointer }
  .mascot{margin-top:auto;text-align:center}
  .mascot img{max-width:140px;height:auto;user-select:none;-webkit-user-drag:none}
  .badge{ position:absolute; top:8px; right:8px; background:#111; color:#fff; font:500 12px/1 system-ui,Arial; padding:4px 8px; border-radius:999px; pointer-events:none; }
  .badge.warn{ background:var(--warn) }

  /* on masque la légende numérotée */
  .num{display:none!important}
</style>
</head>
<body>
<button id="toggleSide" class="toggler" title="Afficher/masquer le menu">☰</button>

<aside id="side" class="side" aria-label="Outils de lecture">
  <div class="header"><div class="title">Outils</div></div>

  <div class="section">
    <div class="row"><strong>Pages</strong></div>
    <div class="row">
      <button class="btn" id="prev">◂</button>
      <span class="pill" id="pageDisp">1</span>
      <button class="btn" id="next">▸</button>
      <input id="pageJump" class="jump" type="number" min="1" step="1" placeholder="n°" />
    </div>
  </div>

  <div class="section">
    <div class="row"><strong>Affichage</strong></div>
    <div class="row">
      <button class="btn" id="mode1up">1 page</button>
      <button class="btn" id="mode2up">2 pages</button>
    </div>
    <label class="row" style="gap:6px">
      <input type="checkbox" id="bookMode" /> Pair à gauche / impair à droite
    </label>
  </div>

  <div class="section">
    <div class="row"><strong>Zoom</strong></div>
    <div class="row">
      <button class="btn" id="zoomOut">–</button>
      <span class="pill" id="zoomVal">100%</span>
      <button class="btn" id="zoomIn">+</button>
      <input id="zoomSlider" type="range" min="30" max="200" value="100" step="1" />
    </div>
    <div class="row">
      <button class="btn btn-amber" id="fitWidth">Adapter à la largeur</button>
      <button class="btn" id="resetZoom">100%</button>
    </div>
  </div>

  <div class="section">
    <div class="row"><strong>Corrections</strong></div>
    <div class="row">
      <button id="toggleRect" class="btn btn-dark">Locales : OFF</button>
      <button id="undo" class="btn" title="Revenir en arrière (Ctrl+Z)">↶</button>
      <button id="clear" class="btn">Effacer</button>
    </div>
    <button id="revealAll" class="btn btn-amber" disabled>Préchargement… 0%</button>
  </div>

  <div class="section">
    <div class="row"><strong>Liens</strong></div>
    <div class="row">
      <button id="linksReload" class="btn">Recharger</button>
      <button id="linksDebug" class="btn">Afficher zones (debug)</button>
    </div>
    <div class="row" style="font-size:12px;opacity:.7">
      <span id="linksInfo">Chargement des liens…</span>
    </div>
  </div>

  <div class="mascot"><img src="./mascotte.png" alt="Mascotte FMttn" draggable="false" /></div>
</aside>

<div class="wrap"><div id="viewport" aria-live="polite" class="flow-1up"></div></div>

<script type="module">
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

/* Noms exacts des deux PDF */
const DOC_PDF =
  "./docs/Altx_1a_Sans_Corrections_version%20Numabib.pdf";
const CORR_PDF =
  "./corrections/monDoc/Altx_1a_Corrections_version%20Numabib.pdf";

const RENDER_SCALE = 1.5;
const REF_WIDTH_PX = Math.round(1240 * 0.35 * 2);
const MIN_PCT = 30, MAX_PCT = 200, KEEP_AROUND = 4;

let pdfDoc, pdfCorr;
let layout = "1up", bookMode = false, zoomPct = 100, drawMode = false;
let currentIndex = 0, firstPageWidth = null, DEBUG_LINKS = false;
let scrollTimer = null;
const pages = [], historyStack = [];
const $ = id => document.getElementById(id);
const $viewport = $("viewport"), $pageDisp = $("pageDisp");
const $pageJump = $("pageJump"), $zoomVal = $("zoomVal");
const $side = $("side"), $slider = $("zoomSlider");
const $undo = $("undo"), $revealAll = $("revealAll");
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

const spacer = document.createElement("div");
spacer.className = "page spacer";
const spacerBox = document.createElement("div");
spacerBox.className = "box";
spacer.appendChild(spacerBox);

function cssScaleFromPct(){
  return !firstPageWidth ? 1 : (zoomPct/100)*(REF_WIDTH_PX/firstPageWidth);
}
function applyZoom(){
  const s = cssScaleFromPct();
  for(const p of pages){
    p.box.style.width = Math.round(p.w*s) + "px";
    p.box.style.height = Math.round(p.h*s) + "px";
  }
  if(pages[0]){
    spacerBox.style.width = Math.round(pages[0].w*s) + "px";
    spacerBox.style.height = Math.round(pages[0].h*s) + "px";
  }
  $zoomVal.textContent = zoomPct + "%";
  $slider.value = String(zoomPct);
}
function fitWidth(){
  if(!firstPageWidth) return;
  const gutter = parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue("--gutter")) || 18;
  const target = layout === "1up"
    ? $viewport.clientWidth - 2
    : ($viewport.clientWidth - gutter) / 2;
  zoomPct = clamp(Math.round((target/firstPageWidth)*100*
    (firstPageWidth/REF_WIDTH_PX)), MIN_PCT, MAX_PCT);
  applyZoom();
}

function cardsReal(){
  return [...document.querySelectorAll(".page:not(.spacer)")];
}
function syncPageUI(){
  $pageDisp.textContent = String(currentIndex+1);
  $pageJump.value = String(currentIndex+1);
}
function gotoIndex(target){
  target = clamp(target,0,pages.length-1);
  currentIndex = target;
  syncPageUI();
  pages[target].elPage.scrollIntoView({behavior:"smooth",block:"start"});
  maintainRenderWindow();
}
function goto(by){
  const cards = cardsReal(), top = window.scrollY+4;
  let best = {idx:0,dy:1e9};
  cards.forEach((el,i)=>{
    const y = el.getBoundingClientRect().top+window.scrollY;
    const dy = Math.abs(y-top);
    if(dy<best.dy) best={idx:i,dy};
  });
  gotoIndex(best.idx+by);
}
function updateNavFromScroll(){
  let best={idx:0,vis:0};
  pages.forEach((p,i)=>{
    const r=p.elPage.getBoundingClientRect();
    const vis=Math.max(0,Math.min(r.bottom,innerHeight)-Math.max(r.top,0));
    if(vis>best.vis) best={idx:i,vis};
  });
  currentIndex=best.idx;
  syncPageUI();
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(maintainRenderWindow,120);
}

async function internalPage(dest){
  const explicit = typeof dest === "string"
    ? await pdfDoc.getDestination(dest) : dest;
  if(!explicit || !explicit[0]) return null;
  const ref=explicit[0];
  if(typeof ref === "object") return (await pdfDoc.getPageIndex(ref))+1;
  return Number.isInteger(ref) ? ref+1 : null;
}
async function mountPdfLinks(p,page,viewport){
  const annotations=await page.getAnnotations({intent:"display"});
  p.linksLayer.innerHTML="";
  let count=0;
  for(const a of annotations){
    if(a.subtype!=="Link" || !a.rect) continue;
    const rect=viewport.convertToViewportRectangle(a.rect);
    const left=Math.min(rect[0],rect[2]), top=Math.min(rect[1],rect[3]);
    const link=document.createElement("a");
    link.className="link-hotspot"+(DEBUG_LINKS?" dbg":"");
    link.style.left=(left/p.w*100)+"%";
    link.style.top=(top/p.h*100)+"%";
    link.style.width=(Math.abs(rect[2]-rect[0])/p.w*100)+"%";
    link.style.height=(Math.abs(rect[3]-rect[1])/p.h*100)+"%";
    if(a.url){
      link.href=a.url; link.target="_blank"; link.rel="noopener noreferrer";
    }else if(a.dest){
      link.href="#";
      link.addEventListener("click",async e=>{
        e.preventDefault();
        if(drawMode) toggleDrawMode(false);
        const n=await internalPage(a.dest);
        if(n) gotoIndex(n-1);
      });
    }else continue;
    p.linksLayer.appendChild(link);
    count++;
  }
  p.linkCount=count;
  p.linksLoaded=true;
  updateLinksInfo();
}
function updateLinksInfo(){
  const done=pages.filter(p=>p.linksLoaded).length;
  const total=pages.reduce((s,p)=>s+(p.linkCount||0),0);
  $("linksInfo").textContent=total+" lien(s) détecté(s) sur "+
    done+" page(s) chargée(s)";
}
function updateLinksInteractivity(){
  for(const p of pages){
    p.linksLayer.classList.toggle("links-blocked",drawMode);
    p.canDr.style.pointerEvents=drawMode?"auto":"none";
  }
}
function toggleDrawMode(on){
  drawMode=on;
  $("toggleRect").textContent="Locales : "+(on?"ON":"OFF");
  $("toggleRect").classList.toggle("btn-dark",on);
  updateLinksInteractivity();
}

async function renderDocument(p){
  if(p.docRendered || p.docRendering) return p.docRendering;
  p.docRendering=(async()=>{
    const page=await pdfDoc.getPage(p.idx);
    const vp=page.getViewport({scale:RENDER_SCALE});
    p.docCanvas.width=Math.ceil(vp.width);
    p.docCanvas.height=Math.ceil(vp.height);
    await page.render({
      canvasContext:p.docCanvas.getContext("2d"),viewport:vp
    }).promise;
    p.docRendered=true;
    if(!p.linksLoaded) await mountPdfLinks(p,page,vp);
  })().catch(e=>{
    console.error("Page "+p.idx,e);
    p.elPage.classList.add("missing");
  }).finally(()=>p.docRendering=null);
  return p.docRendering;
}
async function ensureCorrection(p){
  if(p.corrRendered) return true;
  if(p.corrRendering) return p.corrRendering;
  p.corrRendering=(async()=>{
    const page=await pdfCorr.getPage(p.idx);
    const vp=page.getViewport({scale:RENDER_SCALE});
    p.corrCanvas.width=Math.ceil(vp.width);
    p.corrCanvas.height=Math.ceil(vp.height);
    await page.render({
      canvasContext:p.corrCanvas.getContext("2d"),viewport:vp
    }).promise;
    p.corrRendered=true;
    return true;
  })().catch(e=>{
    console.error("Correction "+p.idx,e);
    return false;
  }).finally(()=>p.corrRendering=null);
  return p.corrRendering;
}
async function redrawOverlay(p){
  const ctx=p.canOv.getContext("2d");
  ctx.clearRect(0,0,p.w,p.h);
  if(!p.showAll && !p.zones.length) return;
  if(!await ensureCorrection(p)) return;
  if(p.showAll){
    ctx.drawImage(p.corrCanvas,0,0,p.w,p.h);
    return;
  }
  for(const r of p.zones){
    ctx.drawImage(p.corrCanvas,r.x,r.y,r.w,r.h,r.x,r.y,r.w,r.h);
  }
}
function redrawDraft(p,d){
  const ctx=p.canDr.getContext("2d");
  ctx.clearRect(0,0,p.w,p.h);
  if(!d) return;
  ctx.strokeStyle="#9CA3AF";
  ctx.lineWidth=3;
  const x=d.w>=0?d.x:d.x+d.w, y=d.h>=0?d.y:d.y+d.h;
  ctx.strokeRect(x,y,Math.abs(d.w),Math.abs(d.h));
}
function attachDrawHandlers(p){
  let draft=null;
  const toLocal=e=>{
    const r=p.canDr.getBoundingClientRect();
    return {x:(e.clientX-r.left)*p.w/r.width,
            y:(e.clientY-r.top)*p.h/r.height};
  };
  p.canDr.addEventListener("pointerdown",e=>{
    if(!drawMode) return;
    p.canDr.setPointerCapture(e.pointerId);
    draft=toLocal(e); draft.w=0; draft.h=0;
    redrawDraft(p,draft);
  });
  p.canDr.addEventListener("pointermove",e=>{
    if(!drawMode || !draft) return;
    const m=toLocal(e);
    draft.w=m.x-draft.x; draft.h=m.y-draft.y;
    redrawDraft(p,draft);
  });
  p.canDr.addEventListener("pointerup",()=>{
    if(!drawMode || !draft) return;
    const r={x:draft.w>=0?draft.x:draft.x+draft.w,
      y:draft.h>=0?draft.y:draft.y+draft.h,
      w:Math.abs(draft.w),h:Math.abs(draft.h)};
    draft=null;
    if(r.w>6 && r.h>6){
      p.zones.push(r);
      historyStack.push({page:p,rect:r});
      $undo.disabled=false;
      redrawOverlay(p);
    }
    redrawDraft(p,null);
  });
}

async function makePage(n){
  const page=await pdfDoc.getPage(n);
  const vp=page.getViewport({scale:RENDER_SCALE});
  const el=document.createElement("div");
  el.className="page";
  const badge=document.createElement("div");
  badge.className="badge"; badge.textContent="Page "+n;
  el.appendChild(badge);
  const box=document.createElement("div");
  box.className="box"; el.appendChild(box);
  const docCanvas=document.createElement("canvas");
  docCanvas.className="pdfPage"; box.appendChild(docCanvas);
  const canOv=document.createElement("canvas");
  canOv.className="ov"; box.appendChild(canOv);
  const linksLayer=document.createElement("div");
  linksLayer.className="linksLayer"; box.appendChild(linksLayer);
  const canDr=document.createElement("canvas");
  canDr.className="dr"; box.appendChild(canDr);
  const corrCanvas=document.createElement("canvas");
  const w=Math.ceil(vp.width),h=Math.ceil(vp.height);
  canOv.width=canDr.width=w;
  canOv.height=canDr.height=h;
  const p={idx:n,box,elPage:el,docCanvas,corrCanvas,canOv,canDr,
    linksLayer,w,h,zones:[],showAll:false,docRendered:false,
    corrRendered:false,linksLoaded:false,linkCount:0};
  pages.push(p);
  if(!firstPageWidth) firstPageWidth=w;
  attachDrawHandlers(p);
}
function mount1up(){
  $viewport.className="flow-1up";
  $viewport.innerHTML="";
  for(const p of pages) $viewport.appendChild(p.elPage);
}
function mount2up(){
  $viewport.className="flow-2up";
  $viewport.innerHTML="";
  if(bookMode){
    const s=document.createElement("div");
    s.className="spread"; s.append(spacer,pages[0].elPage);
    $viewport.appendChild(s);
    for(let i=1;i<pages.length;i+=2){
      const sp=document.createElement("div");
      sp.className="spread";
      sp.appendChild(pages[i].elPage);
      if(pages[i+1]) sp.appendChild(pages[i+1].elPage);
      $viewport.appendChild(sp);
    }
  }else{
    for(let i=0;i<pages.length;i+=2){
      const sp=document.createElement("div");
      sp.className="spread";
      sp.appendChild(pages[i].elPage);
      if(pages[i+1]) sp.appendChild(pages[i+1].elPage);
      $viewport.appendChild(sp);
    }
  }
}
function rebuild(){
  layout==="1up"?mount1up():mount2up();
  applyZoom(); updateNavFromScroll(); maintainRenderWindow();
}
function releasePage(p){
  if(p.docRendering || p.corrRendering) return;
  p.docCanvas.width=p.docCanvas.height=1;
  p.docRendered=false;
  p.corrCanvas.width=p.corrCanvas.height=1;
  p.corrRendered=false;
}
function maintainRenderWindow(){
  pages.forEach((p,i)=>{
    if(Math.abs(i-currentIndex)<=KEEP_AROUND){
      renderDocument(p);
      if(p.showAll || p.zones.length) redrawOverlay(p);
    }else releasePage(p);
  });
}
function doUndo(){
  if(pages.some(p=>p.showAll)){
    for(const p of pages){p.showAll=false;redrawOverlay(p);}
    $revealAll.textContent="Tout révéler";
  }
  const last=historyStack.pop();
  if(!last){$undo.disabled=true;return;}
  const i=last.page.zones.lastIndexOf(last.rect);
  if(i!==-1) last.page.zones.splice(i,1);
  redrawOverlay(last.page);
  $undo.disabled=!historyStack.length;
}

async function init(){
  try{
    const opts={
      cMapUrl:"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps/",
      cMapPacked:true
    };
    [pdfDoc,pdfCorr]=await Promise.all([
      pdfjsLib.getDocument({...opts,url:DOC_PDF}).promise,
      pdfjsLib.getDocument({...opts,url:CORR_PDF}).promise
    ]);
    if(pdfDoc.numPages!==pdfCorr.numPages){
      throw new Error("Les deux PDF n'ont pas le même nombre de pages ("+
        pdfDoc.numPages+" et "+pdfCorr.numPages+").");
    }
    $pageJump.max=String(pdfDoc.numPages);
    for(let n=1;n<=pdfDoc.numPages;n++) await makePage(n);
    rebuild();
    toggleDrawMode(false);
  }catch(e){
    console.error(e);
    alert("Impossible de charger les PDF : "+e.message);
  }

  let collapsed=false;
  const setCollapsed=c=>{
    collapsed=c;
    $side.classList.toggle("collapsed",c);
    document.documentElement.style.setProperty("--panelW",c?"0px":"270px");
  };
  $("toggleSide").onclick=()=>setCollapsed(!collapsed);
  setCollapsed(false);

  $("mode1up").onclick=()=>{layout="1up";rebuild();};
  $("mode2up").onclick=()=>{layout="2up";rebuild();};
  $("bookMode").onchange=e=>{
    bookMode=e.target.checked;
    if(layout==="2up") rebuild();
  };
  $("zoomIn").onclick=()=>{
    zoomPct=clamp(zoomPct+10,MIN_PCT,MAX_PCT);applyZoom();
  };
  $("zoomOut").onclick=()=>{
    zoomPct=clamp(zoomPct-10,MIN_PCT,MAX_PCT);applyZoom();
  };
  $("fitWidth").onclick=fitWidth;
  $("resetZoom").onclick=()=>{zoomPct=100;applyZoom();};
  $slider.oninput=e=>{
    zoomPct=clamp(parseInt(e.target.value,10),MIN_PCT,MAX_PCT);
    applyZoom();
  };
  $("prev").onclick=()=>goto(-1);
  $("next").onclick=()=>goto(1);
  $pageJump.onchange=()=>{
    const n=parseInt($pageJump.value,10);
    if(!Number.isNaN(n)) gotoIndex(n-1);
  };
  $("toggleRect").onclick=()=>toggleDrawMode(!drawMode);
  $("clear").onclick=()=>{
    for(const p of pages){
      p.zones=[];p.showAll=false;redrawOverlay(p);
    }
    historyStack.length=0;
    $undo.disabled=true;
    $revealAll.textContent="Tout révéler";
  };
  $undo.onclick=doUndo;
  $undo.disabled=true;
  $revealAll.disabled=false;
  $revealAll.textContent="Tout révéler";
  $revealAll.onclick=()=>{
    const reveal=!pages.some(p=>p.showAll);
    for(const p of pages) p.showAll=reveal;
    $revealAll.textContent=reveal?"Masquer tout":"Tout révéler";
    maintainRenderWindow();
  };
  $("linksReload").textContent="Liens du PDF";
  $("linksReload").disabled=true;
  $("linksDebug").onclick=()=>{
    DEBUG_LINKS=!DEBUG_LINKS;
    for(const p of pages){
      p.linksLayer.querySelectorAll(".link-hotspot")
        .forEach(a=>a.classList.toggle("dbg",DEBUG_LINKS));
    }
  };

  addEventListener("scroll",
    ()=>requestAnimationFrame(updateNavFromScroll),{passive:true});
  document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft") goto(-1);
    if(e.key==="ArrowRight") goto(1);
    if(e.key==="+" || e.key==="="){
      zoomPct=clamp(zoomPct+10,MIN_PCT,MAX_PCT);applyZoom();
    }
    if(e.key==="-" || e.key==="_"){
      zoomPct=clamp(zoomPct-10,MIN_PCT,MAX_PCT);applyZoom();
    }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z") doUndo();
  });
  $viewport.addEventListener("contextmenu",e=>e.preventDefault());
}
init();
</script>
</body>
</html>
